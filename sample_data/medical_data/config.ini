probable_questions = "What are the main outcomes measured in values clarification methods?", "How many clinical trials in cardio-oncology were analyzed in the bibliometric study?", "What is the ABCDEF approach in preventive cardio-oncology?", "What are the key recommendations for preventing cardiac dysfunction during cancer treatment?", "Which cardiovascular toxicities are associated with different cancer therapies?", "What is the prevalence of cardiovascular disease in cancer survivors?"
document_info = "A collection of medical research papers focused on cardio-oncology - the intersection of cardiovascular disease and cancer care. The documents include: (1) a systematic review and meta-analysis of values clarification methods in patient decision aids for medical decision-making, (2) a bibliometric analysis of clinical trials in cardio-oncology examining research characteristics and trends from 1990-2022, and (3) an opinion piece on preventive cardio-oncology discussing cardiovascular disease prevention in cancer patients and survivors. Papers contain standard research sections including abstracts, methodology, results, discussion, references, and clinical recommendations for managing cardiovascular complications in cancer treatment."